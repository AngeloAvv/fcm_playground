name: fcm_playground
description: "A tool to test Firebase Cloud Messaging (FCM) notifications on supported devices."
publish_to: 'none'
version: 1.0.0+1
repository: https://github.com/AngeloAvv/fcm_playground
issue_tracker: https://github.com/AngeloAvv/fcm_playground/issues
homepage: https://www.angelocassano.it

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_route: ^11.2.0
  collection: ^1.19.1
  dart_mapper: ^1.0.10
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^12.3.0
  flutter_bloc: ^9.1.1
  flutter_essentials_kit: ^2.9.1
  flutter_launch_arguments: ^1.1.0
  freezed_annotation: ^3.1.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  http: ^1.6.0
  intl: any
  pine: ^1.0.4
  provider: ^6.1.5+1
  reactive_forms: ^18.2.2
  rxdart: ^0.28.0
  shared_preferences: ^2.5.6
  talker: ^5.1.20
  flutter_staggered_grid_view: ^0.7.0
  json_text_field:
    git: https://github.com/antonioCaballero17/json_text_field.git
  settings_ui: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.6.0
  bloc_test: ^10.0.0
  build_runner: ^2.4.9
  dart_mapper_generator: ^1.0.10
  data_fixture_dart: ^3.0.0
  drift_dev: ^2.26.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

dependency_overrides:
  # json_text_field pins ^16, which does not compile on Flutter 3.47
  extended_text_field: ^17.0.0
